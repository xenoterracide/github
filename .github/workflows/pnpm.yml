name: pnpm
on: [workflow_call]
jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
