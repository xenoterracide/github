# Renders one copier template variant and verifies the render.
#
# Contract with the caller: the repository is a copier template whose
# `tests/verify.sh <variant>` renders that variant into a scratch directory,
# installs its dependencies, and runs the render's own checks.
name: copier
on:
  workflow_call:
    inputs:
      variant:
        description: Template variant to render and verify.
        required: true
        type: string
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      # no `cache: maven` — it aborts the job when the checkout has no
      # pom.xml, and a template repo keeps its pom inside the render
      - uses: actions/setup-java@v6.2.0
        if: inputs.variant == 'java'
        with:
          distribution: temurin
          java-version: 25.0.5+8.0.LTS
      - run: ./tests/verify.sh "${{ inputs.variant }}"
